spring:
  application:
    name: stockyard-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockyard}
    username: ${DB_USER:stockyard}
    password: ${DB_PASSWORD:stockyard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

stockyard:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
    public-base-url: ${UPLOADS_PUBLIC_BASE_URL:/uploads}
